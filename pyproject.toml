[project]
name = "sentientmarkets-api"
version = "1.0.0"
description = "Four-channel stock sentiment scoring engine (market, narrative, influencer, macro) with a FastAPI read API — reference implementation of 'How to Quantify Stock Sentiment'."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

# Runtime dependencies are pinned in requirements.txt (deployed by Railway/nixpacks);
# development tooling lives in requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["exports", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length is handled by the formatter; long SQL/log strings are kept intact
    "B008",   # FastAPI's Depends()/Query() defaults are the framework idiom
    "B905",   # zip(strict=) — inputs are built pairwise; not worth the churn
    "UP017",  # timezone.utc vs datetime.UTC — equivalent; keep the explicit spelling
    "UP045",  # Optional[X] in pydantic schemas reads clearly; no behavior change
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E402"]   # assert False / late imports are fine in tests
"scripts/**" = ["E402"]           # CLI scripts set sys.path / load .env before imports

[tool.ruff.lint.isort]
known-first-party = ["api", "pipeline", "scripts", "research"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "integration_test_*.py"]
markers = [
    "integration: marks tests as integration tests (real API calls, DB, Redis)",
]
